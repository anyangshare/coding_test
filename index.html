<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 안전점검 보고서 열람 시스템</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- 헤더 영역 -->
    <header class="header">
      <div class="header-badge">행정안전부 안전정책총괄과</div>
      <h1 class="header-title">2026 상반기 안전점검 종합보고서</h1>
      <p class="header-desc">부서 내부 열람 및 키워드 검색용 정적 대시보드</p>
    </header>

    <!-- 검색 및 필터 컨트롤러 -->
    <section class="search-section">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="검색할 키워드를 입력하세요 (예: 권혁수, 450건, 예산, 시정)" 
          autocomplete="off"
        >
        <button id="clearBtn" class="clear-btn" title="검색어 지우기">&times;</button>
      </div>
      <div class="result-bar">
        <span class="result-count" id="resultCount">불러오는 중...</span>
      </div>
    </section>

    <!-- 카드 그리드 영역 -->
    <main>
      <div id="cardsContainer" class="cards-grid">
        <!-- 자바스크립트로 카드가 동적 생성됩니다 -->
      </div>
      <div id="emptyState" class="empty-state" style="display: none;">
        <p class="empty-title">일치하는 검색 결과가 없습니다.</p>
        <p class="empty-desc">다른 키워드로 다시 검색해 보세요.</p>
      </div>
    </main>

    <footer class="footer">
      <p>© 2026 안전정책총괄과 | 업무 참고용 내부 자료</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
